name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  collector-quality:
    name: Collector quality
    runs-on: windows-latest

    defaults:
      run:
        working-directory: collector

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: "collector/uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run Ruff
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Run unit tests
        run: uv run pytest -m unit

  databricks-quality:
    name: Databricks quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: databricks

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: "databricks/uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run Ruff
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Run unit tests
        run: uv run pytest -m unit

      - name: Build Databricks wheel
        run: uv build --wheel

