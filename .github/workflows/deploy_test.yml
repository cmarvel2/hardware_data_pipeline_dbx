name: Deploy test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databricks-test-deployment
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Deploy Databricks test bundle
    runs-on: ubuntu-latest
    environment: test

    defaults:
      run:
        working-directory: databricks

    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: "databricks/uv.lock"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.10.0
        with:
          version: "1.15.0"

      - name: Verify Databricks identity
        run: databricks current-user me

      - name: Validate test bundle
        run: databricks bundle validate --target test

      - name: Deploy test bundle
        run: databricks bundle deploy --target test