bundle:
  name: hardware_data_pipeline
  uuid: 9b1d2f2c-b496-44e8-9d84-eb1ff2ea2ae5

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    path: .
    build: uv build --wheel

variables:
  catalog:
    description: The catalog name to use
  bronze_schema:
    description: The schema name where ingested data lands
  landing_volume:
    description: The managed volume name for hardware external azure data ingestion 
  bronze_table: 
    description: The table created that the volume data is ingested
  silver_schema:
    description: The schema where transformed bronz data is stored
  silver_sensors_table:
    description: fact table for cleaned sensors data
  silver_dbx_metadata_table:
    description: dim table for source file metadata and dbx transformation metadata
  silver_tests_table:
    description: dim table for metadata on hardware silver_tests_table
  ops_schema:
    description: schema for operational functions i.e checkpoints for ingestion tracking
  ops_volume:
    description: volume to hold folders for checkpoints and schema inference
  inc_quarantine_table:
    description: table holding quarantined data for incoming data from the raw bronze table
  out_quarantine_table:
    description: table holding quarantined data from the unpacked sensors fact data before it is normalized
  gold_schema:
    description: The schema where tables used for analysis are
  


targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405612414795918.18.azuredatabricks.net
    variables:
      catalog: hardware_dev  
      bronze_schema: bronze
      landing_volume: hardware_landing
      bronze_table: sensor_readings
      silver_schema: silver
      silver_sensors_table: fct_sensors
      silver_dbx_metadata_table: dim_dbx_metadata
      silver_tests_table: dim_hardware_tests
      ops_schema: ops
      ops_volume: pipeline_operations
      inc_quarantine_table: incoming_silver_quarantine
      out_quarantine_table: outgoing_silver_quarantine
      gold_schema: gold


  test:
    mode: production
    workspace:
      host: https://adb-7405606385601384.4.azuredatabricks.net
      root_path: /Workspace/Users/cmarvel@umich.edu/.bundle/${bundle.name}/${bundle.target}
    variables: 
      catalog: hardware_test
      bronze_schema: bronze
      landing_volume: hardware_landing
      bronze_table: sensor_readings
    permissions:
      - user_name: cmarvel@umich.edu
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://adb-7405606693826607.7.azuredatabricks.net
      root_path: /Workspace/Users/cmarvel@umich.edu/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: hardware_prod
      bronze_schema: bronze
      landing_volume: hardware_landing
      bronze_table: sensor_readings
    permissions:
      - user_name: cmarvel@umich.edu
        level: CAN_MANAGE
