bundle:
  name: hardware_data_pipeline
  uuid: 9b1d2f2c-b496-44e8-9d84-eb1ff2ea2ae5

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    path: .
    build: uv build --wheel

variables:
  catalog:
    description: The catalog name to use
  bronze_schema:
    description: The schema name where ingested data lands
  landing_volume:
    description: The managed volume name for hardware external azure data ingestion 
  bronze_table: 
    description: The table created that the volume data is ingested


targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405612414795918.18.azuredatabricks.net
    variables:
      catalog: hardware_dev  
      bronze_schema: bronze
      landing_volume: hardware_landing
      bronze_table: sensor_readings

  test:
    mode: production
    workspace:
      host: https://adb-7405606385601384.4.azuredatabricks.net
      root_path: /Workspace/Users/cmarvel@umich.edu/.bundle/${bundle.name}/${bundle.target}
    variables: 
      catalog: hardware_test
      bronze_schema: bronze
      landing_volume: hardware_landing
      bronze_table: sensor_readings
    permissions:
      - user_name: cmarvel@umich.edu
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://adb-7405606693826607.7.azuredatabricks.net
      root_path: /Workspace/Users/cmarvel@umich.edu/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: hardware_prod
      bronze_schema: bronze
      landing_volume: hardware_landing
      bronze_table: sensor_readings
    permissions:
      - user_name: cmarvel@umich.edu
        level: CAN_MANAGE
